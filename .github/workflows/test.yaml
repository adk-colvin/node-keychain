on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  # Mocked unit + compat suite: runs everywhere, enforces c8 coverage thresholds
  # (95% lines / 90% branches / 90% functions) and npm audit.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 20, 22, 24 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run coverage
      - run: npm audit --audit-level=low
        if: matrix.node == 22

  # Full suite, including the real `security` CLI against the login keychain: macOS only.
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 20, 22, 24 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  # The test runner needs Node 20.19+, but the library has no engine
  # requirement; this checks it still runs on older Node, with security mocked.
  old-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 10, 12, 14, 16, 18 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/smoke/old-node.js
